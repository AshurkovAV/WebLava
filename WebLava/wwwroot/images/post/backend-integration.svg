<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Backend и интеграции мобильного приложения">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="accent10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa6220"/>
      <stop offset="1" stop-color="#ef8b33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg10)"/>

  <!-- server rack -->
  <g>
    <rect x="150" y="130" width="220" height="240" rx="10" fill="#2b303a" stroke="#3a4050" stroke-width="4"/>
    <rect x="172" y="156" width="176" height="34" rx="6" fill="#191c22"/>
    <circle cx="192" cy="173" r="6" fill="url(#accent10)"/>
    <rect x="172" y="200" width="176" height="34" rx="6" fill="#191c22"/>
    <circle cx="192" cy="217" r="6" fill="#4a5162"/>
    <rect x="172" y="244" width="176" height="34" rx="6" fill="#191c22"/>
    <circle cx="192" cy="261" r="6" fill="#4a5162"/>
    <rect x="172" y="288" width="176" height="34" rx="6" fill="#191c22"/>
    <circle cx="192" cy="305" r="6" fill="url(#accent10)"/>
  </g>

  <!-- database cylinder -->
  <g transform="translate(480,150)">
    <ellipse cx="90" cy="20" rx="90" ry="26" fill="url(#accent10)"/>
    <rect x="0" y="20" width="180" height="150" fill="#2b303a"/>
    <ellipse cx="90" cy="170" rx="90" ry="26" fill="#2b303a" stroke="#3a4050" stroke-width="4"/>
    <ellipse cx="90" cy="80" rx="90" ry="24" fill="none" stroke="#3a4050" stroke-width="3"/>
    <ellipse cx="90" cy="125" rx="90" ry="24" fill="none" stroke="#3a4050" stroke-width="3"/>
  </g>

  <!-- connection lines -->
  <path d="M370 250 C 420 250, 430 220, 480 220" stroke="url(#accent10)" stroke-width="6" fill="none" stroke-dasharray="10 8"/>
  <path d="M370 290 C 420 290, 430 260, 480 260" stroke="#d6d8e2" stroke-width="4" fill="none" stroke-dasharray="6 6" opacity="0.6"/>
</svg>
