<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Прибыльность и монетизация мобильного приложения">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa6220"/>
      <stop offset="1" stop-color="#ef8b33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>

  <!-- growth line -->
  <polyline points="160,360 280,300 360,330 460,220 560,250 660,140" fill="none" stroke="url(#accent3)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="620,150 660,140 650,180" fill="url(#accent3)"/>
  <g fill="#d6d8e2">
    <circle cx="160" cy="360" r="8"/>
    <circle cx="280" cy="300" r="8"/>
    <circle cx="360" cy="330" r="8"/>
    <circle cx="460" cy="220" r="8"/>
    <circle cx="560" cy="250" r="8"/>
  </g>
  <line x1="140" y1="400" x2="680" y2="400" stroke="#3a4050" stroke-width="4"/>

  <!-- coin -->
  <circle cx="600" cy="330" r="50" fill="#2b303a" stroke="url(#accent3)" stroke-width="6"/>
  <text x="600" y="345" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#ef8b33" text-anchor="middle">₽</text>
</svg>
