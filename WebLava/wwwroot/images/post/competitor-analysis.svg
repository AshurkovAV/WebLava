<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Анализ конкурентов на рынке мобильных приложений">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa6220"/>
      <stop offset="1" stop-color="#ef8b33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>

  <!-- bar chart -->
  <g>
    <rect x="220" y="300" width="46" height="110" rx="6" fill="#3a4050"/>
    <rect x="286" y="250" width="46" height="160" rx="6" fill="#4a5162"/>
    <rect x="352" y="190" width="46" height="220" rx="6" fill="url(#accent2)"/>
    <rect x="418" y="260" width="46" height="150" rx="6" fill="#3a4050"/>
  </g>
  <line x1="190" y1="410" x2="500" y2="410" stroke="#d6d8e2" stroke-width="4"/>

  <!-- magnifying glass -->
  <circle cx="560" cy="180" r="70" fill="none" stroke="#d6d8e2" stroke-width="14"/>
  <line x1="610" y1="230" x2="670" y2="290" stroke="#d6d8e2" stroke-width="18" stroke-linecap="round"/>
  <circle cx="560" cy="180" r="70" fill="url(#accent2)" opacity="0.15"/>

  <!-- small dots representing competitors -->
  <g fill="#d6d8e2" opacity="0.6">
    <circle cx="140" cy="150" r="8"/>
    <circle cx="170" cy="130" r="6"/>
    <circle cx="120" cy="180" r="5"/>
  </g>
</svg>
