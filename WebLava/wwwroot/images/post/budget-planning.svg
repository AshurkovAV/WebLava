<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Планирование бюджета на разработку мобильного приложения">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa6220"/>
      <stop offset="1" stop-color="#ef8b33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>

  <!-- calculator -->
  <rect x="260" y="120" width="200" height="270" rx="18" fill="#2b303a" stroke="#3a4050" stroke-width="4"/>
  <rect x="284" y="146" width="152" height="60" rx="8" fill="#f4f5f8"/>
  <text x="360" y="188" font-family="Arial, sans-serif" font-size="30" fill="#20242c" text-anchor="middle">125 000</text>
  <g fill="url(#accent4)">
    <rect x="284" y="224" width="34" height="34" rx="6"/>
    <rect x="330" y="224" width="34" height="34" rx="6"/>
    <rect x="376" y="224" width="34" height="34" rx="6"/>
    <rect x="284" y="270" width="34" height="34" rx="6"/>
    <rect x="330" y="270" width="34" height="34" rx="6"/>
    <rect x="376" y="270" width="34" height="34" rx="6"/>
    <rect x="284" y="316" width="34" height="34" rx="6"/>
    <rect x="330" y="316" width="34" height="34" rx="6"/>
    <rect x="376" y="316" width="34" height="34" rx="6"/>
  </g>

  <!-- coins -->
  <g>
    <ellipse cx="560" cy="330" rx="64" ry="20" fill="#3a4050"/>
    <ellipse cx="560" cy="312" rx="64" ry="20" fill="url(#accent4)"/>
    <ellipse cx="540" cy="270" rx="52" ry="16" fill="#3a4050"/>
    <ellipse cx="540" cy="256" rx="52" ry="16" fill="#f4f5f8" opacity="0.85"/>
  </g>
</svg>
