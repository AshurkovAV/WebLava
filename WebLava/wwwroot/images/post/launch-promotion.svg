<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Запуск и продвижение мобильного приложения в сторах">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242c"/>
      <stop offset="1" stop-color="#121417"/>
    </linearGradient>
    <linearGradient id="accent8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fa6220"/>
      <stop offset="1" stop-color="#ef8b33"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg8)"/>

  <!-- rocket trail -->
  <path d="M360 420 C 340 340, 380 260, 430 180" stroke="#3a4050" stroke-width="10" stroke-dasharray="2 14" stroke-linecap="round" fill="none"/>

  <!-- rocket body -->
  <g transform="translate(400,120) rotate(28)">
    <path d="M0 0 C 40 10, 46 80, 30 150 L -30 150 C -46 80, -40 10, 0 0 Z" fill="url(#accent8)"/>
    <circle cx="0" cy="70" r="18" fill="#2b303a"/>
    <path d="M-30 120 L -70 170 L -30 160 Z" fill="#d6d8e2"/>
    <path d="M30 120 L 70 170 L 30 160 Z" fill="#d6d8e2"/>
    <path d="M-16 150 L 0 200 L 16 150 Z" fill="#f4f5f8"/>
  </g>

  <!-- stars -->
  <g fill="#d6d8e2" opacity="0.7">
    <circle cx="160" cy="120" r="4"/>
    <circle cx="220" cy="90" r="3"/>
    <circle cx="600" cy="140" r="4"/>
    <circle cx="650" cy="200" r="3"/>
    <circle cx="140" cy="260" r="3"/>
  </g>

  <!-- app store badge shape -->
  <rect x="520" y="330" width="200" height="70" rx="14" fill="#2b303a" stroke="url(#accent8)" stroke-width="4"/>
  <text x="620" y="374" font-family="Arial, sans-serif" font-size="26" fill="#d6d8e2" text-anchor="middle">App Store</text>
</svg>
